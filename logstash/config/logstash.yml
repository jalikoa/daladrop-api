################################################################################
# logstash/config/logstash.yml
#
# PURPOSE:
# Core Logstash settings. Configures HTTP endpoints, pipeline workers,
# and queue settings for resilience against Elasticsearch backpressure.
################################################################################

# Bind HTTP API to all interfaces (useful for monitoring plugins)
http.host: "0.0.0.0"

# Disable X-Pack monitoring if not using Elastic Stack monitoring features
xpack.monitoring.enabled: false

# ============================================================================
# PIPELINE PERFORMANCE & RESILIENCE
# ============================================================================
# Number of workers to process events. A good rule of thumb is the number of CPU cores.
pipeline.workers: 2

# Number of events to retrieve from the input queue per worker thread.
pipeline.batch.size: 250

# Maximum time (in milliseconds) to wait for events to fill a batch before flushing.
pipeline.batch.delay: 50

# ============================================================================
# QUEUE SETTINGS (PERSISTENT QUEUE)
# ============================================================================
# Enable persistent queue to prevent data loss if Logstash or Elasticsearch 
# temporarily goes down. Events are written to disk before processing.
# queue.type: persisted
# queue.max_bytes: 1gb