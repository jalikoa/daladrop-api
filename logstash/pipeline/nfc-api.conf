################################################################################
# logstash/pipeline/nfc-api.conf
#
# Input  : TCP on port 5044 — NestJS ships newline-delimited JSON here
# Filter : parse the Winston JSON, extract fields, enrich with geo/metadata
# Output : Elasticsearch daily index  nfc-api-logs-YYYY.MM.DD
################################################################################

input {
  tcp {
    port  => 5044
    codec => json_lines {
      charset => "UTF-8"
    }
    tags  => ["nestjs"]
  }
}

filter {

  # ─── Drop empty / heartbeat messages ─────────────────────────────────────
  if [message] == "" or [message] =~ /^\s+$/ {
    drop {}
  }

  # ─── Winston standard fields → ECS-like names ────────────────────────────
  mutate {
    rename => {
      "level"    => "log.level"
      "context"  => "service.name"
      "pid"      => "process.pid"
      "hostname" => "host.name"
    }
    add_field => {
      "app"         => "nfc-payment-api"
      "environment" => "${NODE_ENV:development}"
    }
  }

  # ─── Normalise log level strings ─────────────────────────────────────────
  if [log.level] == "verbose" { mutate { update => { "log.level" => "debug" } } }

  # ─── Parse HTTP request fields if present ────────────────────────────────
  if [http] {
    mutate {
      add_field => {
        "http.request.method"  => "%{[http][method]}"
        "http.response.status" => "%{[http][status_code]}"
        "url.path"             => "%{[http][url]}"
      }
    }
    if [http][duration_ms] {
      mutate { convert => { "[http][duration_ms]" => "float" } }
    }
  }

  # ─── Parse payment event fields ──────────────────────────────────────────
  if [payment] {
    mutate {
      add_tag => ["payment_event"]
    }
  }

  # ─── Redact sensitive fields ──────────────────────────────────────────────
  mutate {
    remove_field => [
      "[payload][password]",
      "[payload][password_hash]",
      "[payload][refresh_token]",
      "[payload][access_token]",
      "[extra][nfc_key]"
    ]
  }

  # ─── Timestamp ────────────────────────────────────────────────────────────
  if [timestamp] {
    date {
      match    => ["timestamp", "ISO8601"]
      target   => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ─── GeoIP on client IP ───────────────────────────────────────────────────
  if [ip_address] and [ip_address] != "127.0.0.1" and [ip_address] != "::1" {
    geoip {
      source => "ip_address"
      target => "geo"
    }
  }
}

output {
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    index    => "nfc-api-logs-%{+YYYY.MM.dd}"
    action   => "index"

    # ILM (Index Lifecycle Management) — uncomment when you have xpack
    # ilm_enabled  => true
    # ilm_rollover_alias => "nfc-api-logs"
    # ilm_policy   => "nfc-30-day-policy"
  }

  # Uncomment to also see output in Logstash container logs (debug only)
  # stdout { codec => rubydebug }
}