################################################################################
# logstash/pipeline/api.conf
#
# PURPOSE:
# Ingests newline-delimited JSON logs from NestJS (via Filebeat or direct TCP),
# parses and enriches the data, redacts sensitive information, and outputs
# to Elasticsearch using a daily index pattern.
#
# NOTE: This pipeline is designed to be project-agnostic. Adjust the 
# 'redact' and 'enrich' sections based on your specific application's log schema.
################################################################################

input {
  # ============================================================================
  # INPUT: TCP (Direct from App or via Filebeat)
  # ============================================================================
  tcp {
    port  => 5044
    codec => json_lines {
      charset => "UTF-8"
    }
    tags  => ["api_logs"]
  }
}

filter {
  # ============================================================================
  # FILTER 1: Drop empty or heartbeat messages
  # ============================================================================
  if [message] == "" or [message] =~ /^\s+$/ {
    drop {}
  }

  # ============================================================================
  # FILTER 2: Map Winston fields to Elastic Common Schema (ECS) names
  # ============================================================================
  mutate {
    rename => {
      "level"    => "log.level"
      "context"  => "service.name"
      "pid"      => "process.pid"
      "hostname" => "host.name"
    }
    add_field => {
      "app"         => "api"
      "environment" => "${NODE_ENV:development}"
    }
  }

  # ============================================================================
  # FILTER 3: Normalize log level strings
  # ============================================================================
  if [log.level] == "verbose" { 
    mutate { update => { "log.level" => "debug" } } 
  }

  # ============================================================================
  # FILTER 4: Parse HTTP request fields if present in the log payload
  # ============================================================================
  if [http] {
    mutate {
      add_field => {
        "http.request.method"  => "%{[http][method]}"
        "http.response.status" => "%{[http][status_code]}"
        "url.path"             => "%{[http][url]}"
      }
    }
    if [http][duration_ms] {
      mutate { convert => { "[http][duration_ms]" => "float" } }
    }
  }

  # ============================================================================
  # FILTER 5: Tag specific business events (e.g., transactions, audits)
  # ============================================================================
  if [transaction] or [audit] {
    mutate {
      add_tag => ["business_event"]
    }
  }

  # ============================================================================
  # FILTER 6: Redact sensitive fields (CRITICAL for compliance like GDPR/HIPAA)
  # ============================================================================
  mutate {
    remove_field => [
      "[payload][password]",
      "[payload][password_hash]",
      "[payload][refresh_token]",
      "[payload][access_token]",
      "[extra][api_key]",
      "[http][headers][authorization]"
    ]
  }

  # ============================================================================
  # FILTER 7: Parse and normalize the timestamp
  # ============================================================================
  if [timestamp] {
    date {
      match    => ["timestamp", "ISO8601"]
      target   => "@timestamp"
      remove_field => ["timestamp"]
    }
  }

  # ============================================================================
  # FILTER 8: GeoIP enrichment on client IP address
  # ============================================================================
  if [ip_address] and [ip_address] != "127.0.0.1" and [ip_address] != "::1" {
    geoip {
      source => "ip_address"
      target => "geo"
      # Optional: specify fields to keep to save disk space
      # fields => ["city_name", "country_name", "region_name", "location"]
    }
  }
}

output {
  # ============================================================================
  # OUTPUT: Elasticsearch
  # ============================================================================
  elasticsearch {
    hosts    => ["http://elasticsearch:9200"]
    
    # This daily index pattern perfectly matches the Grafana datasource config: [api-logs-]YYYY.MM.DD
    index    => "api-logs-%{+YYYY.MM.dd}"
    action   => "index"

    # ========================================================================
    # INDEX LIFECYCLE MANAGEMENT (ILM)
    # Uncomment and configure when using Elastic Stack with X-Pack enabled.
    # This automatically rolls over and deletes old indices to save disk space.
    # ========================================================================
    # ilm_enabled  => true
    # ilm_rollover_alias => "api-logs"
    # ilm_policy   => "api-30-day-policy"
  }

  # ============================================================================
  # OUTPUT: Stdout (Debugging only)
  # Uncomment to inspect parsed events in the Logstash container logs.
  # DO NOT leave enabled in production (causes severe performance degradation).
  # ============================================================================
  # stdout { codec => rubydebug }
}