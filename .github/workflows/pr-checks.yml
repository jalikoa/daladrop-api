################################################################################
# .github/workflows/pr-checks.yml
#
# PURPOSE:
# Lightweight, fast checks that run on every pull request to provide immediate
# feedback to developers. Designed to finish in under 3 minutes.
################################################################################

name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  typecheck:
    name: "TypeScript Check"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: "Type check (no emit)"
        run: npx tsc --noEmit

  lint-changed:
    name: "Lint Changed Files"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Required for git diff against base branch
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: "Get changed TypeScript files"
        id: changed
        run: |
          FILES=$(git diff --name-only --diff-filter=ACMRT origin/${{ github.base_ref }}...HEAD \
            | grep '\.ts$' | grep -v '\.d\.ts$' | grep -v '\.spec\.ts$' | tr '\n' ' ')
          echo "files=$FILES" >> $GITHUB_OUTPUT
      - name: "Lint changed files"
        if: steps.changed.outputs.files != ''
        run: npx eslint ${{ steps.changed.outputs.files }} --max-warnings=0

  pr-title:
    name: "PR Title Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Check PR title follows conventional commits"
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            chore
            ci
            revert
          requireScope: false