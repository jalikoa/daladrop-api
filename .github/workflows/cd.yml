################################################################################
# .github/workflows/cd.yml
#
# Runs ONLY after CI passes on main.
# Builds and pushes the Docker image to GHCR, then SSH-deploys to the server.
#
# Required secrets (Settings → Secrets → Actions):
#   DEPLOY_HOST          — server IP or hostname
#   DEPLOY_USER          — SSH user (e.g. ubuntu)
#   DEPLOY_SSH_KEY       — private key (matching the public key on the server)
#   DEPLOY_APP_DIR       — absolute path to the project on the server
#   GHCR_TOKEN           — GitHub PAT with packages:write (or use GITHUB_TOKEN)
################################################################################

name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:

  # ────────────────────────────────────────────────────────────────────────────
  # Only deploy when CI passed
  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: "Deploy to Production"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          target: production

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_APP_DIR }}
            echo "${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}
            docker compose pull app
            docker compose up -d --no-deps app
            docker image prune -f
            echo "Deployed ${{ github.sha }} at $(date)"