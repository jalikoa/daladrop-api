bugs:
  - id: merchant_me_shadowed
    severity: high
    file: src/modules/merchants/merchants.controller.ts
    issue: >
      @Get('me') is declared AFTER @Get(':id'). NestJS matches /merchants/me
      as id='me' and calls findOne(NaN) which throws. Move @Get('me') to
      line 1 of route declarations (before @Get(':id')).

  - id: nfc_decode_shadowed
    severity: high
    file: src/modules/nfc/nfc.controller.ts
    issue: >
      @Get('decode') is declared AFTER @Get(':id'). /nfc/decode is matched
      as id='decode' and ParseIntPipe throws a 400. Move @Get('decode')
      above @Get(':id').

  - id: webhook_logs_no_auth
    severity: medium
    file: src/modules/webhooks/webhooks.controller.ts
    issue: >
      GET /webhooks/logs and GET /webhooks/logs/:id have no auth guard.
      Full webhook payloads (including phone numbers and M-Pesa receipts)
      are publicly readable. Add @UseGuards(JwtAuthGuard, RolesGuard)
      @Roles(UserRole.ADMIN).

  - id: payments_stk_no_auth
    severity: low
    file: src/modules/payments/payments.controller.ts
    issue: >
      POST /payments/stk has no auth guard. Any unauthenticated caller can
      trigger an STK push to any phone number. Add rate-limiting and
      consider requiring a valid encrypted merchant token instead.

  - id: ledger_controller_empty
    severity: low
    file: src/modules/ledger/ledger.controller.ts
    issue: >
      LedgerService.getBalance() and LedgerService.record() have no HTTP
      endpoints. Add GET /ledger/accounts/:id/balance (ADMIN) at minimum
      for reconciliation tooling.