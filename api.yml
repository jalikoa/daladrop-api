################################################################################
# NFC Payment API — Full Endpoint Reference
# Base URL : http://localhost:3000
# Auth     : Bearer JWT unless marked [public]
# Notes    :
#   ⚠ merchants GET /me must be moved BEFORE GET /:id in the controller
#     (NestJS resolves static routes in declaration order — currently 'me'
#     is swallowed by /:id and will 404 or behave incorrectly)
#   ⚠ nfc GET /decode must be moved BEFORE GET /:id for the same reason
#   ⚠ ledger_controller & queues_controller are empty — LedgerService
#     exposes record() and getBalance() internally but no HTTP routes exist
#   ⚠ WebhookSource enum in code uses DARAJA/AFRICASTALKING but the DB
#     schema only lists MPESA/STRIPE/PAYPAL/INTERNAL/THIRD_PARTY — migrate
#     before enabling webhook endpoints
################################################################################

base_url: "http://localhost:3000"

endpoints:

  # ─────────────────────────────────────────────────────────────────────────
  # ROOT
  # ─────────────────────────────────────────────────────────────────────────
  - id: root_hello
    method: GET
    path: /
    auth: none
    description: >
      Health / smoke-test root. Returns the AppService greeting string.
      Good first check that the server is up.
    curl: |
      curl -sS http://localhost:3000/

  # ─────────────────────────────────────────────────────────────────────────
  # PUBLIC — NFC payment landing (no auth)
  # ─────────────────────────────────────────────────────────────────────────
  - id: public_pay
    method: GET
    path: /pay
    auth: none
    description: >
      Public NFC tap entry point. Receives the encrypted token written on the
      merchant's NFC tag / QR code, decodes it via DecodeTokenUseCase, and
      returns the merchant payment context (merchant id, amount hint, etc.)
      so the frontend can render the payment form.
    params:
      query:
        token: "<ENCRYPTED_TOKEN>  # base64/AES encrypted merchant payload"
    curl: |
      curl -sS "http://localhost:3000/pay?token=<ENCRYPTED_TOKEN>"

  # ─────────────────────────────────────────────────────────────────────────
  # AUTH
  # ─────────────────────────────────────────────────────────────────────────
  - id: auth_login
    method: POST
    path: /auth/login
    auth: none
    description: >
      Authenticates a user by email+password (or phone+password).
      Returns a signed JWT access token and a refresh token.
      Interceptor logs the attempt to audit_logs.
    body:
      email: "alice@example.com"
      password: "secret"
    curl: |
      curl -sS -X POST http://localhost:3000/auth/login \
        -H "Content-Type: application/json" \
        -d '{"email":"alice@example.com","password":"secret"}'

  - id: auth_refresh
    method: POST
    path: /auth/refresh
    auth: none
    description: >
      Exchanges a valid refresh_token for a new access token + refresh token
      pair. Use this to silently renew sessions without re-login.
    body:
      refresh_token: "<REFRESH_TOKEN>"
    curl: |
      curl -sS -X POST http://localhost:3000/auth/refresh \
        -H "Content-Type: application/json" \
        -d '{"refresh_token":"<REFRESH_TOKEN>"}'

  # ─────────────────────────────────────────────────────────────────────────
  # HEALTH
  # ─────────────────────────────────────────────────────────────────────────
  - id: health_check
    method: GET
    path: /health
    auth: none
    description: >
      Full health check: probes DB connection, Redis, and any registered
      sub-checks. Returns status:'ok' if all pass, 'error' with detail if any
      sub-check is down. Safe to poll from an uptime monitor.
    curl: |
      curl -sS http://localhost:3000/health

  - id: health_ready
    method: GET
    path: /health/ready
    auth: none
    description: >
      Lightweight Kubernetes-style readiness probe. Returns
      {status:'ready'} once the app can serve traffic, otherwise
      {status:'not_ready'}. No DB query, just an in-memory flag.
    curl: |
      curl -sS http://localhost:3000/health/ready

  - id: health_metrics
    method: GET
    path: /health/metrics
    auth: jwt
    roles: [ADMIN]
    description: >
      System metrics snapshot: heap usage, CPU, uptime, memory. Admin only.
      Useful for quick server diagnostics without a full APM tool.
    curl: |
      curl -sS http://localhost:3000/health/metrics \
        -H "Authorization: Bearer <JWT>"

  - id: health_version
    method: GET
    path: /health/version
    auth: none
    description: >
      Returns the npm package version and NODE_ENV. Useful for confirming
      which build is deployed.
    curl: |
      curl -sS http://localhost:3000/health/version

  # ─────────────────────────────────────────────────────────────────────────
  # AUDIT LOGS
  # ─────────────────────────────────────────────────────────────────────────
  - id: audit_get_logs
    method: GET
    path: /audit/logs
    auth: jwt
    roles: [ADMIN]
    description: >
      Paginated list of audit_logs entries. Can be filtered by user_id and/or
      action string. Covers all login attempts, user/merchant mutations, and
      any action logged via AuditService.
    params:
      query:
        page: "1        # default 1"
        limit: "20       # default 20"
        user_id: "2      # optional, filter by user"
        action: "LOGIN   # optional, filter by action string"
    curl: |
      curl -sS "http://localhost:3000/audit/logs?page=1&limit=20" \
        -H "Authorization: Bearer <JWT>"

      # filter by user
      curl -sS "http://localhost:3000/audit/logs?user_id=2&action=LOGIN" \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # USERS
  # ─────────────────────────────────────────────────────────────────────────
  - id: users_create
    method: POST
    path: /users
    auth: jwt
    roles: [ADMIN]
    description: >
      Creates a new identity_users record. Hashes the password before
      persisting. Interceptor writes a CREATE_USER entry to audit_logs.
    body:
      email: "alice@example.com"
      password: "secret"
      phone_number: "+254712345678"
      role: "CUSTOMER"
    curl: |
      curl -sS -X POST http://localhost:3000/users \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"email":"alice@example.com","password":"secret","role":"CUSTOMER"}'

  - id: users_list
    method: GET
    path: /users
    auth: jwt
    roles: [ADMIN]
    description: >
      Paginated list of all users. Returns id, uuid, email, phone_number,
      role, status — password_hash is excluded via select:false on the entity.
    params:
      query:
        page: "1"
        limit: "10"
    curl: |
      curl -sS "http://localhost:3000/users?page=1&limit=10" \
        -H "Authorization: Bearer <JWT>"

  - id: users_get_by_id
    method: GET
    path: /users/:id
    auth: jwt
    roles: [ADMIN, self]
    description: >
      Fetches a single user by numeric PK. UserOwnerGuard allows the
      authenticated user to access their own record; ADMIN can access any.
    params:
      path:
        id: "2"
    curl: |
      curl -sS http://localhost:3000/users/2 \
        -H "Authorization: Bearer <JWT>"

  - id: users_get_by_uuid
    method: GET
    path: /users/uuid/:uuid
    auth: jwt
    roles: [ADMIN, self]
    description: >
      Same as GET /users/:id but looks up by UUID string instead of numeric
      PK. Useful when the client only has the UUID from a token payload.
    params:
      path:
        uuid: "e09e307f-7600-4dd1-b530-44696dd62d89"
    curl: |
      curl -sS http://localhost:3000/users/uuid/e09e307f-7600-4dd1-b530-44696dd62d89 \
        -H "Authorization: Bearer <JWT>"

  - id: users_update
    method: PATCH
    path: /users/:id
    auth: jwt
    roles: [ADMIN, self]
    description: >
      Partial update of a user record (email, phone_number, password, role,
      status). UserOwnerGuard ensures regular users can only edit themselves.
      Password is re-hashed if provided.
    params:
      path:
        id: "2"
    body:
      phone_number: "+254799000001"
    curl: |
      curl -sS -X PATCH http://localhost:3000/users/2 \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"phone_number":"+254799000001"}'

  - id: users_delete
    method: DELETE
    path: /users/:id
    auth: jwt
    roles: [ADMIN]
    description: >
      Soft or hard delete of a user (implementation in UsersService.remove).
      Admin only. Cascades to merchant_profiles if foreign keys allow.
    params:
      path:
        id: "2"
    curl: |
      curl -sS -X DELETE http://localhost:3000/users/2 \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # MERCHANTS
  # ⚠ BUG: GET 'me' is declared AFTER GET ':id' in the controller file.
  #   NestJS resolves routes in declaration order, so /merchants/me is
  #   matched by /:id with id='me' before the static route is reached.
  #   Fix: move @Get('me') above @Get(':id') in merchants.controller.ts
  # ─────────────────────────────────────────────────────────────────────────
  - id: merchants_create
    method: POST
    path: /merchants
    auth: jwt
    roles: [ADMIN]
    description: >
      Creates a merchant_profiles row linked to an existing user. The target
      user_id is passed as a query param. Sets status=PENDING and
      verification_status=UNVERIFIED by default.
    params:
      query:
        user_id: "2"
    body:
      business_name: "DemoShop"
      paybill_number: "123456789"
      account_number: "123456"
    curl: |
      curl -sS -X POST "http://localhost:3000/merchants?user_id=2" \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"business_name":"DemoShop","paybill_number":"123456789","account_number":"123456"}'

  - id: merchants_list
    method: GET
    path: /merchants
    auth: jwt
    roles: [ADMIN]
    description: >
      Paginated list of all merchant profiles. Optional status filter
      (PENDING | ACTIVE | SUSPENDED | DEACTIVATED). Admin only.
    params:
      query:
        page: "1"
        limit: "10"
        status: "ACTIVE   # optional"
    curl: |
      curl -sS "http://localhost:3000/merchants?page=1&limit=10&status=ACTIVE" \
        -H "Authorization: Bearer <JWT>"

  - id: merchants_get_me
    method: GET
    path: /merchants/me
    auth: jwt
    roles: [MERCHANT, ADMIN]
    description: >
      Returns the merchant profile that belongs to the currently authenticated
      user (looked up via req.user.id → user_id FK). Avoids the need for the
      client to know their own numeric merchant id.
      ⚠ Currently broken — must be moved before GET /:id in the controller.
    curl: |
      curl -sS http://localhost:3000/merchants/me \
        -H "Authorization: Bearer <JWT>"

  - id: merchants_get_by_id
    method: GET
    path: /merchants/:id
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Fetches a single merchant profile by numeric PK. MerchantOwnerGuard
      allows access to the merchant's own record or any ADMIN.
    params:
      path:
        id: "1"
    curl: |
      curl -sS http://localhost:3000/merchants/1 \
        -H "Authorization: Bearer <JWT>"

  - id: merchants_update
    method: PATCH
    path: /merchants/:id
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Partial update of business_name, business_email, business_phone,
      logo_url, paybill_number, account_number, status, or metadata.
      BeforeUpdate hook normalises whitespace.
    params:
      path:
        id: "1"
    body:
      business_email: "shop@example.com"
      business_phone: "+254700000001"
    curl: |
      curl -sS -X PATCH http://localhost:3000/merchants/1 \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"business_email":"shop@example.com"}'

  - id: merchants_payment_link
    method: GET
    path: /merchants/:id/payment-link
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Generates an encrypted payment URL for the merchant. Optionally
      includes a QR code data-URL (base64 PNG) when ?qr=true (default true).
      This is the URL written to NFC tags.
    params:
      path:
        id: "1"
      query:
        qr: "true   # default true; set false to skip QR generation"
    curl: |
      curl -sS "http://localhost:3000/merchants/1/payment-link?qr=true" \
        -H "Authorization: Bearer <JWT>"

  - id: merchants_cards
    method: GET
    path: /merchants/:id/cards
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Lists merchant_cards rows for this merchant (QR code URL, PDF URL,
      created_at). Currently returns an empty array — stub awaiting
      PDF/card generation pipeline. No merchant_cards entity exists yet.
    params:
      path:
        id: "1"
    curl: |
      curl -sS http://localhost:3000/merchants/1/cards \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # NFC TAGS
  # ⚠ BUG: GET 'decode' is declared AFTER GET ':id' in nfc.controller.ts.
  #   /nfc/decode will be matched as /:id with id='decode'.
  #   Fix: move @Get('decode') above @Get(':id').
  # ─────────────────────────────────────────────────────────────────────────
  - id: nfc_create_tag
    method: POST
    path: /nfc
    auth: jwt
    roles: [MERCHANT, ADMIN]
    description: >
      Provisions a new NFC tag for a merchant. Encrypts the merchant payload
      (paybill, account number, payment URL) into encrypted_payload and
      stores the raw tag_uid if provided. BeforeInsert normalises tag_uid
      to uppercase.
    params:
      query:
        merchant_id: "1"
    body:
      tag_uid: "04:AB:CD:EF:12:34"
      description: "Counter tag"
    curl: |
      curl -sS -X POST "http://localhost:3000/nfc?merchant_id=1" \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"tag_uid":"04:AB:CD:EF:12:34","description":"Counter tag"}'

  - id: nfc_list_tags
    method: GET
    path: /nfc
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Paginated list of NFC tags belonging to a merchant. Returns
      id, tag_uid, encrypted_payload, is_active, description, created_at.
    params:
      query:
        merchant_id: "1"
        page: "1"
        limit: "10"
    curl: |
      curl -sS "http://localhost:3000/nfc?merchant_id=1&page=1&limit=10" \
        -H "Authorization: Bearer <JWT>"

  - id: nfc_decode_token
    method: GET
    path: /nfc/decode
    auth: none
    description: >
      Decrypts an NFC/QR token and returns the merchant payment context.
      Mirrors GET /pay but returns raw decoded data rather than an HTML
      redirect. Logs IP address and user-agent.
      ⚠ Currently shadowed by GET /nfc/:id — move this route up in controller.
    params:
      query:
        token: "<ENCRYPTED_TOKEN>"
    curl: |
      curl -sS "http://localhost:3000/nfc/decode?token=<ENCRYPTED_TOKEN>"

  - id: nfc_get_tag
    method: GET
    path: /nfc/:id
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Fetches a single NFC tag by numeric PK. MerchantOwnerGuard validates
      the caller owns the merchant that owns this tag.
    params:
      path:
        id: "1"
    curl: |
      curl -sS http://localhost:3000/nfc/1 \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # PAYMENTS
  # ─────────────────────────────────────────────────────────────────────────
  - id: payments_initiate_stk
    method: POST
    path: /payments/stk
    auth: none
    description: >
      Initiates a Safaricom M-Pesa STK push to the customer's phone. Creates
      a payment_sessions row with status=PENDING, calls Daraja STK Push API,
      and returns the session_uuid and checkout_request_id for polling.
      No auth required so the NFC landing page can call this directly.
    body:
      merchant_id: 1
      customer_phone: "+254712345678"
      amount: 500.00
      description: "Payment for goods"
    curl: |
      curl -sS -X POST http://localhost:3000/payments/stk \
        -H "Content-Type: application/json" \
        -d '{"merchant_id":1,"customer_phone":"+254712345678","amount":500.00,"description":"Payment for goods"}'

  - id: payments_list
    method: GET
    path: /payments
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Paginated list of payment sessions. When merchant_id is provided,
      scoped to that merchant. Optionally filter by status
      (PENDING | INITIATED | COMPLETED | FAILED | CANCELLED | REFUNDED).
    params:
      query:
        page: "1"
        limit: "10"
        merchant_id: "1   # required to return results"
        status: "COMPLETED  # optional"
    curl: |
      curl -sS "http://localhost:3000/payments?merchant_id=1&status=COMPLETED&page=1&limit=10" \
        -H "Authorization: Bearer <JWT>"

  - id: payments_get_by_id
    method: GET
    path: /payments/:id
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Fetches a payment session by numeric PK. PaymentOwnerGuard ensures
      only the owning merchant or ADMIN can retrieve the record.
    params:
      path:
        id: "1"
    curl: |
      curl -sS http://localhost:3000/payments/1 \
        -H "Authorization: Bearer <JWT>"

  - id: payments_get_by_uuid
    method: GET
    path: /payments/session/:uuid
    auth: none
    description: >
      Polls a payment session by UUID. Called by the frontend after STK push
      to check whether the customer has completed the payment.
      Returns status, mpesa_receipt, completed_at.
    params:
      path:
        uuid: "a3f8c4d2-1234-5678-abcd-ef0123456789"
    curl: |
      curl -sS http://localhost:3000/payments/session/a3f8c4d2-1234-5678-abcd-ef0123456789

  - id: payments_by_merchant
    method: GET
    path: /payments/merchant/:merchantId
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Equivalent to GET /payments?merchant_id= but uses a path param.
      Returns paginated payment sessions for the given merchant.
    params:
      path:
        merchantId: "1"
      query:
        page: "1"
        limit: "10"
        status: "PENDING  # optional"
    curl: |
      curl -sS "http://localhost:3000/payments/merchant/1?page=1&limit=10" \
        -H "Authorization: Bearer <JWT>"

  - id: payments_merchant_statistics
    method: GET
    path: /payments/merchant/:merchantId/statistics
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Aggregated payment statistics for a merchant over a date range:
      total count, total volume, success rate, per-day breakdown.
      Defaults to the last 30 days when from/to are omitted.
    params:
      path:
        merchantId: "1"
      query:
        from: "2026-01-01   # optional ISO date"
        to: "2026-03-15     # optional ISO date"
    curl: |
      curl -sS "http://localhost:3000/payments/merchant/1/statistics?from=2026-01-01&to=2026-03-15" \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # NOTIFICATIONS  (Admin only)
  # ─────────────────────────────────────────────────────────────────────────
  - id: notifications_send_sms
    method: POST
    path: /notifications/sms
    auth: jwt
    roles: [ADMIN]
    description: >
      Enqueues or immediately sends an SMS via the configured provider
      (Africa's Talking or similar). Creates a notifications row with
      channel=SMS. Admin only — use the payments flow for customer receipts.
    body:
      phone: "+254712345678"
      message: "Your payment of KES 500 was received."
    curl: |
      curl -sS -X POST http://localhost:3000/notifications/sms \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"phone":"+254712345678","message":"Your payment of KES 500 was received."}'

  - id: notifications_send_email
    method: POST
    path: /notifications/email
    auth: jwt
    roles: [ADMIN]
    description: >
      Sends a transactional email via the configured provider. Creates a
      notifications row with channel=EMAIL. Subject and HTML body are
      passed directly — no template system wired up yet.
    body:
      email: "alice@example.com"
      subject: "Payment Received"
      body: "<p>Your payment was received.</p>"
    curl: |
      curl -sS -X POST http://localhost:3000/notifications/email \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"email":"alice@example.com","subject":"Payment Received","body":"<p>Your payment was received.</p>"}'

  - id: notifications_send_push
    method: POST
    path: /notifications/push
    auth: jwt
    roles: [ADMIN]
    description: >
      Sends a Firebase-style push notification to a device token. Creates a
      notifications row with channel=PUSH. Use for mobile payment confirmations.
    body:
      token: "<DEVICE_FCM_TOKEN>"
      title: "Payment Confirmed"
      body: "KES 500 received from +254712345678"
    curl: |
      curl -sS -X POST http://localhost:3000/notifications/push \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"token":"<DEVICE_FCM_TOKEN>","title":"Payment Confirmed","body":"KES 500 received"}'

  # ─────────────────────────────────────────────────────────────────────────
  # QR CODES
  # ─────────────────────────────────────────────────────────────────────────
  - id: qr_generate
    method: POST
    path: /qr/generate
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Generates a QR code PNG for any arbitrary data string (usually a
      payment URL). Returns the image as a base64 data-URL. Error correction
      level H is recommended for NFC/card use since part of the code may
      be obscured by a logo.
    body:
      data: "https://pay.example.com/pay?token=<ENCRYPTED_TOKEN>"
      size: 300
      errorCorrection: "H"
    curl: |
      curl -sS -X POST http://localhost:3000/qr/generate \
        -H "Authorization: Bearer <JWT>" \
        -H "Content-Type: application/json" \
        -d '{"data":"https://pay.example.com/pay?token=abc123","size":300,"errorCorrection":"H"}'

  - id: qr_merchant
    method: GET
    path: /qr/merchant/:merchantId
    auth: jwt
    description: >
      Convenience endpoint: auto-builds the payment URL for the merchant and
      returns the QR code as a base64 data-URL. Uses size=300 by default;
      override with ?size=500 for print quality.
    params:
      path:
        merchantId: "1"
      query:
        size: "300  # optional, default 300"
    curl: |
      curl -sS "http://localhost:3000/qr/merchant/1?size=300" \
        -H "Authorization: Bearer <JWT>"

  - id: qr_download
    method: GET
    path: /qr/download/:merchantId
    auth: jwt
    description: >
      Downloads the merchant QR code as a raw PNG binary (Content-Type:
      image/png, Content-Disposition: attachment). Use this for embedding
      in the PDF card. Size fixed at 500px for print resolution.
    params:
      path:
        merchantId: "1"
    curl: |
      curl -sS -OJ "http://localhost:3000/qr/download/1" \
        -H "Authorization: Bearer <JWT>"
      # saves as: merchant_1_qr.png

  # ─────────────────────────────────────────────────────────────────────────
  # PDF / MERCHANT CARDS
  # ─────────────────────────────────────────────────────────────────────────
  - id: pdf_get_merchant_card
    method: GET
    path: /pdf/merchant/:merchantId/card
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Generates (synchronously) and streams the merchant's payment card PDF.
      The card includes the business name, paybill number, account number,
      and embedded QR code. Content-Disposition forces a download.
    params:
      path:
        merchantId: "1"
    curl: |
      curl -sS -OJ "http://localhost:3000/pdf/merchant/1/card" \
        -H "Authorization: Bearer <JWT>"
      # saves as: merchant_1_card.pdf

  - id: pdf_generate_merchant_card
    method: POST
    path: /pdf/merchant/:merchantId/card/generate
    auth: jwt
    roles: [ADMIN, owner]
    description: >
      Queues (async=true, default) or generates synchronously (async=false)
      the merchant card PDF. When async, adds a Bull job to the pdf-queue and
      returns the jobId for later status polling.
    params:
      path:
        merchantId: "1"
      query:
        async: "true  # default true"
    curl: |
      # async (queued)
      curl -sS -X POST "http://localhost:3000/pdf/merchant/1/card/generate?async=true" \
        -H "Authorization: Bearer <JWT>"

      # synchronous
      curl -sS -X POST "http://localhost:3000/pdf/merchant/1/card/generate?async=false" \
        -H "Authorization: Bearer <JWT>"

  - id: pdf_download
    method: GET
    path: /pdf/download/:fileName
    auth: jwt
    roles: [ADMIN, MERCHANT]
    description: >
      Downloads a previously generated PDF file by file name from
      ./uploads/pdf/:fileName on disk. Returns 404 if the file does not
      exist. File name comes from the async generation job result.
    params:
      path:
        fileName: "merchant_1_card.pdf"
    curl: |
      curl -sS -OJ "http://localhost:3000/pdf/download/merchant_1_card.pdf" \
        -H "Authorization: Bearer <JWT>"

  # ─────────────────────────────────────────────────────────────────────────
  # WEBHOOKS
  # ─────────────────────────────────────────────────────────────────────────
  - id: webhook_daraja_stk
    method: POST
    path: /webhooks/daraja/stk
    auth: webhook_secret
    description: >
      Receives the Safaricom Daraja STK Push callback. Validates the request
      via WebhookAuthGuard (checks a shared secret header), logs the raw
      payload to webhook_logs, then updates the matching payment_sessions row
      to COMPLETED or FAILED based on ResultCode. Idempotent — duplicate
      callbacks with the same CheckoutRequestID are ignored.
    body_note: "Sent by Safaricom — do not call manually in production."
    body:
      Body:
        stkCallback:
          MerchantRequestID: "29115-34620561-1"
          CheckoutRequestID: "ws_CO_191220191020363925"
          ResultCode: 0
          ResultDesc: "The service request is processed successfully."
          CallbackMetadata:
            Item:
              - Name: "Amount"
                Value: 500
              - Name: "MpesaReceiptNumber"
                Value: "NLJ7RT61SV"
              - Name: "PhoneNumber"
                Value: 254712345678
    curl: |
      curl -sS -X POST http://localhost:3000/webhooks/daraja/stk \
        -H "Content-Type: application/json" \
        -H "X-Webhook-Secret: <WEBHOOK_SECRET>" \
        -d '{
          "Body": {
            "stkCallback": {
              "MerchantRequestID": "29115-34620561-1",
              "CheckoutRequestID": "ws_CO_191220191020363925",
              "ResultCode": 0,
              "ResultDesc": "The service request is processed successfully.",
              "CallbackMetadata": {
                "Item": [
                  {"Name":"Amount","Value":500},
                  {"Name":"MpesaReceiptNumber","Value":"NLJ7RT61SV"},
                  {"Name":"PhoneNumber","Value":254712345678}
                ]
              }
            }
          }
        }'

  - id: webhook_africastalking_sms
    method: POST
    path: /webhooks/africastalking/sms
    auth: webhook_secret
    description: >
      Receives Africa's Talking SMS delivery report callbacks. Logs to
      webhook_logs with source=AFRICASTALKING and updates the corresponding
      notifications row status to SENT or FAILED.
    body_note: "Sent by Africa's Talking — do not call manually in production."
    body:
      id: "ATXid_1234abcd"
      status: "Success"
      phoneNumber: "+254712345678"
      networkCode: "63902"
    curl: |
      curl -sS -X POST http://localhost:3000/webhooks/africastalking/sms \
        -H "Content-Type: application/json" \
        -H "X-Webhook-Secret: <WEBHOOK_SECRET>" \
        -d '{"id":"ATXid_1234abcd","status":"Success","phoneNumber":"+254712345678"}'

  - id: webhook_logs_list
    method: GET
    path: /webhooks/logs
    auth: none
    description: >
      Paginated list of webhook_logs entries. Filterable by source
      (DARAJA | AFRICASTALKING | STRIPE | PAYPAL | INTERNAL | THIRD_PARTY)
      and status (RECEIVED | PROCESSING | COMPLETED | FAILED | DUPLICATE).
      No auth guard currently — consider adding JwtAuthGuard + ADMIN role.
    params:
      query:
        page: "1"
        limit: "10"
        source: "DARAJA   # optional"
        status: "COMPLETED  # optional"
    curl: |
      curl -sS "http://localhost:3000/webhooks/logs?page=1&limit=10&source=DARAJA"

  - id: webhook_logs_get
    method: GET
    path: /webhooks/logs/:id
    auth: none
    description: >
      Fetches a single webhook_logs entry by numeric PK. Returns full
      payload, response_sent, error_message, and timestamps. Returns 404
      if not found.
      No auth guard currently — consider adding JwtAuthGuard + ADMIN role.
    params:
      path:
        id: "1"
    curl: |
      curl -sS http://localhost:3000/webhooks/logs/1

