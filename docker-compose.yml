###############################################################################
# NFC Payment API — Full Stack
#
# Services:
#   app          NestJS API
#   mysql        MariaDB 11
#   redis        Redis 7
#   prometheus   Metrics scraping
#   grafana      Dashboards
#   elasticsearch  Log storage
#   logstash     Log pipeline
#   kibana       Log exploration
#   filebeat     Log shipper (reads app container stdout/log files)
#
# Usage:
#   docker compose up -d
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
###############################################################################

version: '3.9'

networks:
  app-net:
    driver: bridge
  monitoring-net:
    driver: bridge
  logging-net:
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  prometheus-data:
  grafana-data:
  elasticsearch-data:
  app-logs:

services:

  # ── Application ────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: nfc-api
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      APP_NAME: nfc-api
    volumes:
      - app-logs:/app/logs          # persisted log files for Filebeat
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - app-net
      - monitoring-net
      - logging-net
    labels:
      logging: "true"

  # ── MySQL (MariaDB) ────────────────────────────────────────────────────────
  mysql:
    image: mariadb:11.8
    container_name: nfc-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass}
      MYSQL_DATABASE: ${DB_NAME:-nfc_db}
      MYSQL_USER: ${DB_USERNAME:-nfc_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-nfc_pass}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-net

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nfc-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --save 60 1 --loglevel warning
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - app-net

  # ─────────────────────────────────────────────────────────────────────────
  # METRICS STACK
  # ─────────────────────────────────────────────────────────────────────────

  prometheus:
    image: prom/prometheus:v2.50.1
    container_name: nfc-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
    networks:
      - monitoring-net
    labels:
      app: prometheus

  grafana:
    image: grafana/grafana:10.3.3
    container_name: nfc-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-localhost}
      GF_SMTP_ENABLED: "false"
      # Auto-provision datasource and dashboards on first start
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - monitoring-net
    labels:
      app: grafana

  # ─────────────────────────────────────────────────────────────────────────
  # LOGGING STACK  (ELK)
  # ─────────────────────────────────────────────────────────────────────────

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: nfc-elasticsearch
    restart: unless-stopped
    environment:
      - node.name=es01
      - cluster.name=nfc-logs
      - discovery.type=single-node
      - ELASTIC_PASSWORD=${ELASTIC_PASSWORD:-changeme}
      - xpack.security.enabled=true
      - xpack.security.http.ssl.enabled=false   # TLS terminated at load balancer
      - xpack.security.transport.ssl.enabled=false
      - bootstrap.memory_lock=true
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: >
        curl -s -u elastic:${ELASTIC_PASSWORD:-changeme}
        http://localhost:9200/_cluster/health | grep -q '"status":"green"\|"status":"yellow"'
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - logging-net

  logstash:
    image: docker.elastic.co/logstash/logstash:8.12.2
    container_name: nfc-logstash
    restart: unless-stopped
    environment:
      LS_JAVA_OPTS: "-Xms256m -Xmx256m"
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
    volumes:
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
      - ./logstash/config/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - app-logs:/app/logs:ro                    # reads app log files
    ports:
      - "5044:5044"    # Beats input
      - "5000:5000"    # TCP input (direct from app, fallback)
      - "9600:9600"    # Logstash monitoring API
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - logging-net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: nfc-kibana
    restart: unless-stopped
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_PASSWORD:-changeme}
      SERVER_NAME: nfc-kibana
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-32characterslongencryptionkey__}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:-32characterslongencryptionkey__}
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5601/api/status"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 90s
    networks:
      - logging-net

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.12.2
    container_name: nfc-filebeat
    restart: unless-stopped
    user: root
    environment:
      ELASTICSEARCH_URL: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: elastic
      ELASTICSEARCH_PASSWORD: ${ELASTIC_PASSWORD:-changeme}
      LOGSTASH_URL: logstash:5044
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - app-logs:/app/logs:ro
      # Docker socket for container log collection
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - logstash
    networks:
      - logging-net
    command: filebeat -e -strict.perms=false